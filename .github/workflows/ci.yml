name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        # Deprecated - uses: actions/checkout@v4
        uses: actions/checkout@v5

      - name: Set up Java 21
        # Deprecated - uses: actions/setup-java@v4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify