# docker compose up -d --build
#       -> infrastructure + all four services built from source
#
# docker compose up -d mysql zookeeper kafka-broker kafka-ui kafka-schema-registry keycloak-db keycloak
#       -> infrastructure only (run the services from the IDE)

services:
  # Infrastructure

  # Main database for inventory, booking and order (tables are created by Flyway)
  mysql:
    image: mysql:8.3.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - db-logs:/var/log/mysql
    # Services wait for this check, so they only start once MySQL accepts connections
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka needs ZooKeeper to manage the broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000

  # Message broker for the booking-events topic (booking -> order)
  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Two listeners: 29092 for other containers, 9092 for services started from the IDE
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Web UI to browse topics and messages: http://localhost:8084
  kafka-ui:
    container_name: KAFKA-UI
    restart: unless-stopped
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8084:8080"
    depends_on:
      - kafka-broker
    environment:
      KAFKA_CLUSTERS_0_NAME: localhost
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'


  # Schema Registry (not used by the code yet, kept for future Avro schemas)
  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    restart: unless-stopped
    container_name: kafka-schema-registry
    hostname: kafka-schema-registry
    depends_on:
      - kafka-broker
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: kafka-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://kafka-schema-registry:8081

  # Separate database for Keycloak (users, clients, realm settings)
  keycloak-db:
    container_name: keycloak-mysql
    image: mysql:8.3.0
    restart: unless-stopped
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Identity provider that issues the JWT tokens: http://localhost:8091 (admin / admin)
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    # --import-realm loads the realm from docker/keycloak/realms on the first start
    command: [ "start-dev", "--import-realm" ]
    restart: unless-stopped
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Application services

  # All four are built from the same Dockerfile; MODULE picks the Maven module.
  # The environment variables override the localhost values in application.properties.

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build:
      context: .
      args:
        MODULE: booking-service
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8080/api/v1/inventory
    depends_on:
      mysql:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      inventory-service:
        condition: service_started

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8080/api/v1/inventory
    depends_on:
      mysql:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      inventory-service:
        condition: service_started

  # Single entry point for clients: http://localhost:8090
  api-gateway:
    build:
      context: .
      args:
        MODULE: apigateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      BOOKING_SERVICE_URL: http://booking-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      # Inside Docker, Keycloak listens on 8080 (8091 is only the local port)
      KEYCLOAK_AUTH_JWK_SET_URI: http://keycloak:8080/realms/ticketing-security-realm/protocol/openid-connect/certs
    depends_on:
      - keycloak
      - booking-service
      - inventory-service

volumes:
  db-data:
  db-logs: