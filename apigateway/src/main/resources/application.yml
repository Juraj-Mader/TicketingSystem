server:
  port: 8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/booking/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway